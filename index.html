<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Baguette Tycoon</title>
    <link rel="icon" href="data:," />

    <style>
      :root { --line: #23233F; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ED0F5; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; }
      #loading { box-sizing: border-box; font-family: 'Lilita One', system-ui, sans-serif; }
      #loading .lbar { box-sizing: border-box; }
#loading {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  background: linear-gradient(#8ED0F5, #BFE3F2) center / cover no-repeat;
  transition: opacity .35s;
  --p: 0;
}
#loading.done { opacity: 0; pointer-events: none; }
#loading .ltitle { color: #fff; font-size: 48px; -webkit-text-stroke: 9px var(--line); paint-order: stroke fill; }
#loading.art .ltitle { display: none; }
#loading .lbar {
  width: min(60vw, 420px); height: 26px;
  background: rgba(35, 35, 63, .75); border: 4px solid #fff; border-radius: 999px;
  box-shadow: 0 0 0 3px var(--line), 0 6px 12px rgba(0, 0, 0, .3);
  overflow: hidden;
}
#loading .lbar i { display: block; height: 100%; width: calc(var(--p) * 100%); background: linear-gradient(#FFE27A, #FFC21A 55%, #F0A500); border-radius: 999px; transition: width .2s ease-out; }

#loading.art { justify-content: flex-end; padding-bottom: 6vh; isolation: isolate; background: #23233F; }
#loading.art::before { content: ''; position: absolute; inset: -6%; z-index: -2; background: var(--img) center / cover no-repeat; filter: blur(26px) saturate(1.1); }
#loading.art::after { content: ''; position: absolute; left: 50%; top: 50%; width: var(--bw, 100%); height: var(--bh, 100%); transform: translate(-50%, -50%); z-index: -1; background: var(--img) center / var(--bs, cover) no-repeat; }

#loading.art.whole::after { -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent), linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent); mask-composite: intersect; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loading"><div class="ltitle">Baguette Tycoon</div><div class="lbar"><i></i></div></div>
    <script>
(function () {
        var el = document.getElementById('loading');
        var ratio = innerWidth / innerHeight;
        var formats = [
          { name: 'portrait', aspect: 2 / 3, ext: 'jpg' },
          { name: 'square', aspect: 1, ext: 'png' },
          { name: 'landscape', aspect: 16 / 9, ext: 'jpg' },
        ];
        var format = formats.reduce(function (best, candidate) {
          return Math.abs(Math.log(ratio / candidate.aspect)) < Math.abs(Math.log(ratio / best.aspect)) ? candidate : best;
        });
        var src = 'loading/loading-' + format.name + '.' + format.ext;
        var img = new Image();

        function fit() {
          var r = (innerWidth / innerHeight) / format.aspect, whole = !(r >= 0.92 && r <= 1.08);
          var k = Math.min(innerWidth / img.naturalWidth, innerHeight / img.naturalHeight);
          el.classList.toggle('whole', whole);
          el.style.setProperty('--bw', whole ? Math.round(img.naturalWidth * k) + 'px' : '100%');
          el.style.setProperty('--bh', whole ? Math.round(img.naturalHeight * k) + 'px' : '100%');
          el.style.setProperty('--bs', whole ? '100% 100%' : 'cover');
        }
        img.onload = function () { el.style.setProperty('--img', 'url("' + img.src + '")'); fit(); el.classList.add('art'); addEventListener('resize', fit); };
        img.src = new URL(src, location.href).href;
      })();
</script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
